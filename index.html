<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penny — Cats Database</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="hero">
        <h1>🐱 The Penny Cats</h1>
        <p>A tiny database of very good cats</p>
    </header>

    <main class="container">
        <div id="catGrid" class="cat-grid">
            <p class="loading">Loading cats...</p>
        </div>
    </main>

    <footer class="footer">
        <p>Powered by HTML+CSS+JS+PHP + MySQL 🐾</p>
    </footer>

    <script>
        // Fetch cats from the API
        async function loadCats() {
            const grid = document.getElementById("catGrid");

            try {
                const response = await fetch("get_cats.php", { cache: "no-store" });
                const data = await response.json();

                if (!data.success || !Array.isArray(data.cats)) {
                    throw new Error(data.error || "Could not load cats.");
                }

                if (data.cats.length === 0) {
                    grid.innerHTML = "<p class='loading'>No cats found in the database.</p>";
                    return;
                }

                grid.innerHTML = "";

                data.cats.forEach(cat => {
                    const card = document.createElement("div");
                    card.className = "cat-card";

                    card.innerHTML = `
                        <div class="cat-emoji">🐱</div>
                        <h2 class="cat-name"></h2>
                        <p class="cat-info"><strong>Breed:</strong> ${cat.breed}</p>
                        <p class="cat-info"><strong>Age:</strong> ${cat.age} ${cat.age === 1 ? "year" : "years"}</p>
                        <p class="cat-info"><strong>ID:</strong> #${cat.id}</p>
                    `;

                    card.querySelector(".cat-name").textContent = cat.cat_name;

                    grid.appendChild(card);
                });

            } catch (err) {
                console.error(err);
                grid.innerHTML = `<p class='error'>❌ ${err.message}</p>`;
            }
        }

        loadCats();
    </script>

</body>
</html>
