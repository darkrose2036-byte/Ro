<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cat Store</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- NAVIGATION -->
   
  <header class="navbar">
    <div class="logo">Cat Store 😼</div>

    <div class="nav-right">
      <a href="login.html" class="nav-link">Login</a>
      <a href="signup.html" class="nav-link">Sign Up</a>
      <a href="logout.php" class="nav-link logout-link">Logout</a>
      <span>Inventory Dashboard</span>
      <span class="admin-badge">Admin</span>
    </div>
  </header>

  <!-- MAIN CONTENT -->

  <main class="container">

    <!-- WELCOME -->

    <section class="welcome">
      <div>
        <p class="eyebrow">STORE MANAGEMENT</p>
        <h1>Inventory</h1>
      </div>

      <div class="stats">
        <div class="stat">
          <span>Total Products</span>
          <strong id="totalProducts">0</strong>
        </div>

        <div class="stat">
          <span>Units in Stock</span>
          <strong id="totalStock">0</strong>
        </div>
      </div>
    </section>

    <!-- SEARCH SECTION -->
    <section class="panel">
      <div class="section-heading">
        <div>
          <h2>🔎 Find a Cat</h2>
          <p>Search for a cat using its ID.</p>
        </div>
      </div>

      <form id="searchForm" class="search-form">
        <input
          type="number"
          id="searchInput"
          placeholder="Enter product ID, e.g. 400"
          min="1"
          step="1"
          required
        >
        <button type="submit">Search Product</button>
      </form>

      <div id="searchResult" class="search-result">
        Enter a cat ID to find it.
      </div>

    </section>

    <!-- CATALOG -->
    <section class="catalog-section">
      <div class="section-heading">
        <div>
          <h2>Our Cats</h2>
          <p>Available cats in your store.</p>
        </div>
      </div>

      <div id="gameGrid" class="game-grid"></div>
    </section>

    <!-- ADD NEW CAT -->
    <section class="panel">
      <div class="section-heading">
        <div>
          <h2>➕ Add a New Cat</h2>
        </div>
      </div>

      <form id="addForm" class="add-form">
        <input type="number" id="newId" placeholder="Cat ID" min="1" step="1" required>
        <input type="text" id="newName" placeholder="Cat name" required>
        <input type="number" id="newPrice" placeholder="Age (years)" min="0" step="1" required>
        <input type="text" id="newStock" placeholder="Breed" required>
        <button type="submit">Add Cat</button>
      </form>

      <p id="addMessage"></p>
    </section>

  </main>

  <script src="script.js"></script>

</body>
</html>
